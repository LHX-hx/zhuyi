   ============================================================ */
function makeId(code, val){
  // 用 code + 六维值做稳定哈希
  var seed = 0;
  var src = code + '|' + AX.map(function(a){
    return Math.round((val[a.k]||0) * 100);
  }).join(',');
  for (var i = 0; i < src.length; i++) {
    seed = (seed * 31 + src.charCodeAt(i)) % 99991;
  }
  var d = new Date();
  var mm = String(d.getMonth() + 1);
  var dd = String(d.getDate());
  if (dd.length < 2) dd = '0' + dd;
  var letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  var a = letters[seed % 24];
  var b = letters[Math.floor(seed / 24) % 24];
  var num = String(seed % 100);
  if (num.length < 2) num = '0' + num;
  return a + b + '-' + mm + dd + '-' + num;
}

/* 相似度 → 百分比：把"随便答也能到 85%"的虚高掐掉
   实测 raw cos 在纯随机作答时中位数约 0.69，故以 0.30 为下限、
   0.30~1.00 线性映射到 0~100，得到诚实且仍有区分度的区间。 */
function simPct(sim){
  var s = (typeof sim === 'number' && isFinite(sim)) ? sim : 0;
  var t = (s - 0.30) / 0.70;
  if(t < 0) t = 0;
  if(t > 1) t = 1;
  return Math.round(t * 100);
}

/* 匹配区间：答题本身带噪声，给一个 ±4 个百分点的诚实区间，
   而不是一个看起来很精确的假数字。 */
function simRange(sim){
  var s = (typeof sim === 'number' && isFinite(sim)) ? sim : 0;
  var lo = simPct(s - 0.035), hi = simPct(s + 0.035);
  if(hi - lo < 6){ var mid=(lo+hi)/2; lo=Math.max(0,Math.round(mid-3)); hi=Math.min(100,Math.round(mid+3)); }
  return {lo:lo, hi:hi, mid:Math.round((lo+hi)/2)};
}

/* 匹配档位（区间之外的定性描述） */
function matchBand(pct){
  if(pct >= 80) return '高度契合';
  if(pct >= 62) return '比较契合';
  if(pct >= 42) return '中等接近';
  return '只是有点像';
}

/* 「最不像你的」：sim 可能为负，映射后为 0，说「0% 像」很奇怪，
   所以低于 15% 时换成不含百分比的表述。 */
function leastText(sim){
  var p = simPct(sim);
  if(p < 15) return '和你几乎正好相反';
  if(p < 30) return '只有 ' + p + '% 像';
  return '也有 ' + p + '% 像';
}

function calc(){
  const raw={},items={};
  AX.forEach(a=>{raw[a.k]=0;items[a.k]=[]});
  const od = getOrder();
  S.ans.forEach((oi,pos)=>{
    if(oi===null||oi===undefined)return;
    const realIdx = od[pos];
    const pl = QMAP[String(realIdx + 1)];
    if(!pl)return;
    const v = pl.signs[oi];
    if(!v)return;
    raw[pl.axis]+=v;
    items[pl.axis].push(v);
  });
  // 归一化到 -1 ~ +1
  const val={};
  AX.forEach(a=>{
    const qn=Object.values(QMAP).filter(p=>p.axis===a.k).length||1;
    val[a.k]=raw[a.k]/qn;
  });

  // ===== 去中心化余弦匹配 =====
  // 先算 16 个流派画像的平均方向，再各自减去它
  // 这样"接近平均"的流派不会通吃
  const names=Object.keys(SCHOOLS);
  const center={};
  AX.forEach(a=>{
    let sum=0;
    names.forEach(n=>{ sum+=(SCHOOLS[n].profile[a.k]||0); });
    center[a.k]=sum/names.length;
  });

  const uC={};
  AX.forEach(a=>{ uC[a.k]=(val[a.k]||0)-center[a.k]; });
  const uLen=Math.sqrt(AX.reduce((s,a)=>s+uC[a.k]*uC[a.k],0))||1;

  let best=null, bestSim=-2;
  const scores=[];
  names.forEach(name=>{
    const prof=SCHOOLS[name].profile;
    let dot=0, pLen=0;
    AX.forEach(a=>{
      const pc=(prof[a.k]||0)-center[a.k];
      dot+=uC[a.k]*pc;
      pLen+=pc*pc;
    });
    pLen=Math.sqrt(pLen)||1;
    const sim=dot/(uLen*pLen);
    scores.push({name,sim,dist:1-sim});
    if(sim>bestSim){bestSim=sim;best=name}
  });
  scores.sort((a,b)=>b.sim-a.sim);

  // 矛盾指数：各轴答案离散度
  let t=0,n=0;
  AX.forEach(a=>{
    const arr=items[a.k];if(arr.length<2)return;
    const mean=arr.reduce((s,v)=>s+v,0)/arr.length;
    const sd=Math.sqrt(arr.reduce((s,v)=>s+(v-mean)**2,0)/arr.length);
    t+=sd;n++;
  });

  return {
    val,
    code: best,
    tension: n?Math.min(1,t/n):0,
    sim: bestSim,
    match: simPct(bestSim),
    range: simRange(bestSim),
    scores: scores,
    least: scores[scores.length-1],
    id: makeId(best, val)
  };
}

   ============================================================ */
function sym(ch,s,sw){
  const st='fill="none" stroke="currentColor" stroke-width="'+(sw||s*0.055)+

  const g={

      '<circle cy="'+s*.20+'" r="'+(s*.045)+'" fill="currentColor" stroke="none"/>',
    /* 疾行 K：平行斜线 */
    K:'<path d="M'+(-s*.30)+' '+s*.22+' L'+s*.06+' '+(-s*.24)+'" '+st+'/>'+
      '<path d="M'+(-s*.06)+' '+s*.30+' L'+s*.30+' '+(-s*.16)+'" '+st+'/>',
    /* 外向 W：向外辐射 */
    W:'<circle r="'+(s*.09)+'" '+st+'/>'+
      '<path d="M0 '+(-s*.16)+' L0 '+(-s*.32)+' M'+s*.16+' 0 L'+s*.32+' 0 '+
      'M0 '+s*.16+' L0 '+s*.32+' M'+(-s*.16)+' 0 L'+(-s*.32)+' 0" '+st+'/>',
    /* 内向 N：向内收敛 */
    N:'<path d="M'+(-s*.32)+' '+(-s*.24)+' L0 0 L'+s*.32+' '+(-s*.24)+'" '+st+'/>'+
      '<path d="M'+(-s*.32)+' '+s*.26+' L0 '+s*.02+' L'+s*.32+' '+s*.26+'" '+st+'/>',
    /* 直觉 H：星点 */
    H:'<path d="M0 '+(-s*.32)+' L0 '+s*.32+' M'+(-s*.32)+' 0 L'+s*.32+' 0 '+
      'M'+(-s*.22)+' '+(-s*.22)+' L'+s*.22+' '+s*.22+' M'+s*.22+' '+(-s*.22)+
      ' L'+(-s*.22)+' '+s*.22+'" '+st+'/>',
    /* 理性 L：直角框 */
    L:'<rect x="'+(-s*.24)+'" y="'+(-s*.24)+'" width="'+(s*.48)+'" height="'+(s*.48)+
      '" '+st+'/>',
    /* 诗意 D：缺口圆 */
    D:'<path d="M'+(-s*.30)+' '+(-s*.06)+' A'+(s*.30)+' '+(s*.30)+' 0 1 1 '+
      (s*.06)+' '+(s*.30)+'" '+st+'/>'+
      '<circle cx="'+(s*.34)+'" cy="'+(-s*.28)+'" r="'+(s*.05)+'" fill="currentColor" stroke="none"/>',
    /* 烟火 R：上升的三道火苗 */
    R:'<path d="M0 '+s*.30+' L0 '+(-s*.10)+'" '+st+'/>'+
      '<path d="M'+(-s*.16)+' '+s*.30+' L'+(-s*.16)+' '+s*.04+'" '+st+'/>'+
      '<path d="M'+s*.16+' '+s*.30+' L'+s*.16+' '+s*.04+'" '+st+'/>'+
      '<path d="M0 '+(-s*.10)+' l'+(-s*.06)+' '+(-s*.12)+'" '+st+'/>',
    /* 联结 S：双环相连 */
    S:'<circle cx="'+(-s*.14)+'" cy="0" r="'+(s*.19)+'" '+st+'/>'+
      '<circle cx="'+(-s*.14)+'" cy="'+(-s*.30)+'" r="'+(s*.05)+'" '+
      'fill="currentColor" stroke="none"/>',
    /* 独处 A：单环 */
    A:'<circle r="'+(s*.28)+'" '+st+'/>'+
      '<circle r="'+(s*.06)+'" fill="currentColor" stroke="none"/>'
  };
  return g[ch]||'';
}

/* ============================================================
   徽章：5 符号拼接（32 款自动生成）

/* 16 个流派核心符号（星盘中心） */

/* ============================================================

   accent: 主色  accent2: 次色
   ring: 环样式   spikes: 尖刺样式   deco: 附加装饰

const AURA = {
'虚无主义':   {ac:'#9AA6C0', ac2:'#5A6278', ring:'broken',  spikes:'sparse', deco:'gap', halo:'fade'},

'斯多葛主义': {ac:'#A8B8C8', ac2:'#6A7A8A', ring:'octagon', spikes:'square', deco:'pillar', halo:'square'},
'伊壁鸠鲁主义':{ac:'#D8B888', ac2:'#A88858', ring:'cup',    spikes:'soft',   deco:'cup', halo:'round'},
'享乐主义':   {ac:'#FFD070', ac2:'#E0A030', ring:'sun',     spikes:'ray',    deco:'burst', halo:'burst'},
'悲观主义':   {ac:'#7888A8', ac2:'#48587A', ring:'droop',   spikes:'down',   deco:'rain', halo:'drop'},
'乐观主义':   {ac:'#FFC860', ac2:'#D89A28', ring:'arc',     spikes:'rise',   deco:'sunup', halo:'rising'},

'个人主义':   {ac:'#E8E0C8', ac2:'#A89878', ring:'single',  spikes:'focus',  deco:'dot', halo:'tight'},
'利他主义':   {ac:'#B8E0C0', ac2:'#68A878', ring:'weave',   spikes:'leaf',   deco:'hands', halo:'petal'},
'浪漫主义':   {ac:'#E0B8E8', ac2:'#A070B0', ring:'moon',    spikes:'petal',  deco:'moonarc', halo:'moonarc'},
'理性主义':   {ac:'#90C8E8', ac2:'#4A88B0', ring:'compass', spikes:'tick',   deco:'cross', halo:'oct'},
'实用主义':   {ac:'#C8C870', ac2:'#888830', ring:'arrow',   spikes:'edge',   deco:'arrow', halo:'arrowh'}
};

/* 光圈形状：16 种，按流派变化（空心描边 = 轮廓发光，不遮人物） */
function haloShape(shape, cx, cy, r, uid, op){
  const o = (op === undefined) ? 1 : op;
  const S = 'fill="none" stroke="url(#'+uid+'_haloline)" stroke-width="'+(r*0.17)+
    '" stroke-linejoin="round" stroke-linecap="round" opacity="'+o+'"';
  const poly = (n, rot, rad, sy) => {
    const sq = sy || 1;
    let d = '';
    for(let i=0;i<n;i++){
      const a = (i*360/n + (rot||0)) * Math.PI/180;
      d += (i?'L':'M') + (cx + Math.cos(a)*rad).toFixed(1) + ' ' +
           (cy + Math.sin(a)*rad*sq).toFixed(1);
    }
    return '<path d="'+d+'Z" '+S+'/>';
  };
  const star = (n, rOut, rIn, sy) => {
    const sq = sy || 1;
    let d = '';
    for(let i=0;i<n*2;i++){
      const a = (i*180/n - 90) * Math.PI/180;
      const rad = (i%2===0) ? rOut : rIn;
      d += (i?'L':'M') + (cx + Math.cos(a)*rad).toFixed(1) + ' ' +
           (cy + Math.sin(a)*rad*sq).toFixed(1);
    }
    return '<path d="'+d+'Z" '+S+'/>';
  };
  switch(shape){
    case 'hex':   return poly(6, -90, r*1.06);
    case 'oct':   return poly(8, -67.5, r*1.08);
    case 'square':
      return '<rect x="'+(cx-r*0.84)+'" y="'+(cy-r*0.84)+'" width="'+(r*1.68)+'" height="'+(r*1.68)+
        '" rx="'+(r*0.10)+'" '+S+'/>';
    case 'diamond':  return poly(4, -90, r*1.22, 1.16);
    case 'star6':    return star(6, r*1.24, r*0.56);
    case 'burst':    return star(12, r*1.32, r*0.70);
    case 'flame':
      return '<path d="M'+cx+' '+(cy-r*1.38)+
        ' C'+(cx+r*0.52)+' '+(cy-r*0.86)+' '+(cx+r*0.92)+' '+(cy-r*0.10)+' '+(cx+r*0.80)+' '+(cy+r*0.52)+
        ' C'+(cx+r*0.70)+' '+(cy+r*1.02)+' '+(cx+r*0.30)+' '+(cy+r*1.16)+' '+cx+' '+(cy+r*1.16)+
        ' C'+(cx-r*0.30)+' '+(cy+r*1.16)+' '+(cx-r*0.70)+' '+(cy+r*1.02)+' '+(cx-r*0.80)+' '+(cy+r*0.52)+
        ' C'+(cx-r*0.92)+' '+(cy-r*0.10)+' '+(cx-r*0.52)+' '+(cy-r*0.86)+' '+cx+' '+(cy-r*1.38)+' Z" '+S+'/>';
    case 'drop':
      return '<path d="M'+cx+' '+(cy+r*1.26)+
        ' C'+(cx+r*0.44)+' '+(cy+r*0.70)+' '+(cx+r*0.86)+' '+(cy-r*0.10)+' '+(cx+r*0.72)+' '+(cy-r*0.62)+
        ' C'+(cx+r*0.58)+' '+(cy-r*1.12)+' '+(cx-r*0.58)+' '+(cy-r*1.12)+' '+(cx-r*0.72)+' '+(cy-r*0.62)+
        ' C'+(cx-r*0.86)+' '+(cy-r*0.10)+' '+(cx-r*0.44)+' '+(cy+r*0.70)+' '+cx+' '+(cy+r*1.26)+' Z" '+S+'/>';
    case 'rising':
      return '<ellipse cx="'+cx+'" cy="'+(cy+r*0.10)+'" rx="'+(r*0.90)+'" ry="'+(r*1.28)+'" '+S+'/>';
    case 'wide':
      return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(r*1.30)+'" ry="'+(r*0.82)+'" '+S+'/>';
    case 'petal':    return star(8, r*1.22, r*0.64, 0.96);
    case 'moonarc':
      return '<path d="M'+(cx+r*0.18)+' '+(cy-r*1.14)+
        ' A'+(r*1.20)+' '+(r*1.20)+' 0 1 0 '+(cx+r*0.18)+' '+(cy+r*1.14)+
        ' A'+(r*0.76)+' '+(r*0.88)+' 0 1 1 '+(cx+r*0.18)+' '+(cy-r*1.14)+' Z" '+S+'/>';
    case 'shatter': {
      const pts=[[0,-1.20],[0.72,-0.86],[0.62,-0.20],[1.10,0.22],[0.66,0.72],[0.30,1.12],
                 [-0.28,1.04],[-0.74,0.72],[-1.14,0.16],[-0.62,-0.24],[-0.70,-0.88]];
      let d='';
      pts.forEach((q,i)=>{
        d += (i?'L':'M') + (cx+q[0]*r).toFixed(1) + ' ' + (cy+q[1]*r).toFixed(1);
      });
      return '<path d="'+d+'Z" '+S+'/>';
    }
    case 'tight':
      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.76)+'" '+S+'/>';
    case 'fade':
      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*1.14)+'" '+S+'/>';
    case 'arrowh':
      return '<path d="M'+(cx-r*1.28)+' '+(cy-r*0.62)+
        ' L'+(cx+r*0.30)+' '+(cy-r*0.62)+
        ' L'+(cx+r*0.30)+' '+(cy-r*1.06)+
        ' L'+(cx+r*1.32)+' '+cy+
        ' L'+(cx+r*0.30)+' '+(cy+r*1.06)+
        ' L'+(cx+r*0.30)+' '+(cy+r*0.62)+
        ' L'+(cx-r*1.28)+' '+(cy+r*0.62)+' Z" '+S+'/>';
    default:
      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" '+S+'/>';
  }
}

function badgeSVG(code, size){
  const sc = SCHOOLS[code] || {sym:'single'};
  const kind = sc.sym || 'single';
  const latin = LATIN[code] || '';
  const au = AURA[code] || AURA['个人主义'];
  const AC = au.ac, AC2 = au.ac2;
  const cx = size/2, cy = size/2, R = size*0.40;
  const uid = 'b' + Math.abs(code.split('').reduce((a,c)=>a*31+c.charCodeAt(0),7)) % 99999;

  // ---------- 旋转光束 ----------
  let rays = '';
  for(let i=0;i<16;i++){
    const a=i*22.5*Math.PI/180;
    const long=(i%2===0);
    const r1=R*0.62, r2=R*(long?1.18:1.05);
    const w=long?0.028:0.014;
    rays += '<path d="M'+(cx+Math.cos(a-w)*r1).toFixed(1)+' '+(cy+Math.sin(a-w)*r1).toFixed(1)+
      ' L'+(cx+Math.cos(a)*r2).toFixed(1)+' '+(cy+Math.sin(a)*r2).toFixed(1)+
      ' L'+(cx+Math.cos(a+w)*r1).toFixed(1)+' '+(cy+Math.sin(a+w)*r1).toFixed(1)+' Z" '+
      'fill="url(#'+uid+'_ray)" opacity="'+(long?0.16:0.08)+'"/>';
  }

  // ---------- 尖刺（按流派变化）----------
  let spikes = '';
  const addSpike = (a, r1, r2, w, op) => {
    const x1=cx+Math.cos(a)*r1, y1=cy+Math.sin(a)*r1;
    const x2=cx+Math.cos(a)*r2, y2=cy+Math.sin(a)*r2;
    const px=-Math.sin(a)*w, py=Math.cos(a)*w;
    return '<path d="M'+(x1-px).toFixed(1)+' '+(y1-py).toFixed(1)+
      ' L'+x2.toFixed(1)+' '+y2.toFixed(1)+
      ' L'+(x1+px).toFixed(1)+' '+(y1+py).toFixed(1)+' Z" '+
      'fill="url(#'+uid+'_sp)" opacity="'+op+'"/>';
  };

  const N = 48;
  for(let i=0;i<N;i++){
    const base = i/N*Math.PI*2;
    const isLong = (i%4===0);
    let r1 = R*1.10, r2, w = size*0.006, op = isLong?0.92:0.50;
    switch(au.spikes){
      case 'sparse':
        if(i%3!==0) continue;
        r2 = r1 + (isLong?size*0.058:size*0.030); w=size*0.008; break;
      case 'flame': {
        const wob = Math.sin(i*1.7)*0.012;
        r2 = r1 + size*(isLong?0.070:0.034) + size*wob; w=size*0.009; break;
      }
      case 'jagged': {
        const j=(i%2===0)?1.35:0.55;
        r2 = r1 + size*0.045*j; w=size*0.007*(i%2?1.5:0.6); break;
      }
      case 'square':
        r2 = r1 + (i%2===0?size*0.048:0.016); w=size*0.010; op=isLong?0.85:0.40; break;
      case 'soft':
        r2 = r1 + size*0.026; w=size*0.012; op=0.42; break;
      case 'ray':
        r2 = r1 + (isLong?size*0.088:0.036); w=size*0.011;
        op = isLong?1.0:0.62; break;
      case 'down': {
        r2 = r1 + size*0.030; w=size*0.005;
        const dy = Math.abs(Math.sin(base))*size*0.022;
        const x1=cx+Math.cos(base)*r1, y1=cy+Math.sin(base)*r1+dy;
        const x2=cx+Math.cos(base)*r2, y2=cy+Math.sin(base)*r2+dy*1.6;
        spikes += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+
          '" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+
          '" stroke="'+AC+'" stroke-width="'+w+'" stroke-linecap="round" opacity="0.55"/>';
        continue;
      }
      case 'rise': {
        const up = Math.max(0, -Math.sin(base));
        r2 = r1 + size*(0.030 + up*0.048); w=size*0.007*(0.6+up); break;
      }
      case 'starlt':
        if(i%3!==0) continue;
        r2 = r1 + (isLong?size*0.072:0.034); w=size*0.009; break;
      case 'block':
        r2 = r1 + size*0.038; w=size*0.013; op=0.30; break;
      case 'focus': {
        const dist = Math.abs(Math.cos(base)*Math.cos(base));
        r2 = r1 + size*0.020 + size*0.055*dist; w=size*0.007; break;
      }
      case 'leaf': {
        const sw = Math.sin(base*2)*size*0.008;
        r2 = r1 + (isLong?size*0.058:0.026) + sw; w=size*0.009; break;
      }
      case 'petal': {
        const p = (Math.sin(base*5)+1)/2;
        r2 = r1 + size*(0.024 + p*0.050); w=size*0.007; break;
      }
      case 'tick':
        r2 = r1 + (isLong?size*0.040:0.018); w=size*0.0045;
        op = isLong?0.90:0.42; break;
      case 'edge':
        if(i%2!==0) continue;
        r2 = r1 + size*0.052; w=size*0.010; op=0.75; break;
      default:
        r2 = r1 + (isLong?size*0.055:0.028); w=size*0.007;
    }
    spikes += addSpike(base, r1, r2, w, op);
  }

  // ---------- 环（按流派变化）----------
  let rings = '';
  const ringStroke = 'stroke="url(#'+uid+'_ring)" stroke-opacity="0.92"';
  switch(au.ring){
    case 'broken': {
      // 大缺口环（缺了约 1/4）
      rings = '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" '+ringStroke+
        ' stroke-width="'+(size*0.008)+'" stroke-dasharray="'+(R*4.6)+' '+(R*1.55)+
        '" transform="rotate(-38 '+cx+' '+cy+')"/>';
      // 缺口处的碎屑
      for(let i=0;i<7;i++){
        const a=(i*2.1)*Math.PI/180;
        const rr = R*(1.08 + (i%3)*0.06);
        rings += '<rect x="'+(cx+Math.cos(a)*rr).toFixed(1)+'" y="'+(cy+Math.sin(a)*rr).toFixed(1)+
          '" width="'+(size*0.008)+'" height="'+(size*0.018)+'" fill="'+AC+
          '" opacity="'+(0.20+i*0.045)+'" transform="rotate('+(a*180/Math.PI).toFixed(0)+' '+
          (cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1)+')"/>';
      }
      // 内层极淡残环
      rings += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*0.86)+'" fill="none" stroke="'+AC2+
        '" stroke-width="'+(size*0.0018)+'" opacity="0.22" stroke-dasharray="'+(size*0.09)+' '+(size*0.16)+'"/>';
      break;
    }
    case 'double':
      rings = '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" '+ringStroke+
        ' stroke-width="'+(size*0.007)+'"/>'+
        '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*0.90)+'" fill="none" stroke="'+AC+
        '" stroke-width="'+(size*0.0022)+'" opacity="0.55"/>';
      break;
    case 'tilted': {
      const rot = -8;
      rings = '<g transform="rotate('+rot+' '+cx+' '+cy+')">'+
        '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+R+'" ry="'+(R*0.93)+'" fill="none" '+ringStroke+
        ' stroke-width="'+(size*0.006)+'"/></g>'+
        '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*0.82)+'" fill="none" stroke="'+AC2+
        '" stroke-width="'+(size*0.002)+'" opacity="0.35"/>';
      break;
    }
    case 'octagon': {
      let p8='';
      for(let i=0;i<8;i++){
        const a=(i*45-22.5)*Math.PI/180;
        p8 += (i?'L':'M')+(cx+Math.cos(a)*R).toFixed(1)+' '+(cy+Math.sin(a)*R).toFixed(1);
      }
      rings = '<path d="'+p8+'Z" fill="none" '+ringStroke+' stroke-width="'+(size*0.006)+
        '" stroke-linejoin="miter"/>'+
        '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*0.86)+'" fill="none" stroke="'+AC2+
        '" stroke-width="'+(size*0.002)+'" opacity="0.32"/>';
      break;
    }
    case 'cup':
      rings = '<path d="M'+(cx-R)+' '+(cy-R*0.18)+
        ' A'+R+' '+(R*0.92)+' 0 0 0 '+(cx+R)+' '+(cy-R*0.18)+'" fill="none" '+ringStroke+
        ' stroke-width="'+(size*0.006)+'"/>'+
        '<path d="M'+(cx-R*0.94)+' '+(cy-R*0.18)+' L'+(cx+R*0.94)+' '+(cy-R*0.18)+'" '+
        'stroke="'+AC+'" stroke-width="'+(size*0.003)+'" opacity="0.6"/>';
      break;
    case 'sun': {
      rings = '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" '+ringStroke+
        ' stroke-width="'+(size*0.0065)+'"/>';
      // 内圈放射短线
      for(let i=0;i<24;i++){
        const a=i*15*Math.PI/180;
        rings += '<line x1="'+(cx+Math.cos(a)*R*0.90).toFixed(1)+'" y1="'+(cy+Math.sin(a)*R*0.90).toFixed(1)+
          '" x2="'+(cx+Math.cos(a)*R*0.98).toFixed(1)+'" y2="'+(cy+Math.sin(a)*R*0.98).toFixed(1)+
          '" stroke="'+AC+'" stroke-width="'+(size*0.0025)+'" opacity="0.5"/>';
      }
      break;
    }
    case 'droop':
      rings = '<path d="M'+(cx-R)+' '+(cy-R*0.35)+
        ' A'+R+' '+(R*1.08)+' 0 0 0 '+(cx+R)+' '+(cy-R*0.35)+'" fill="none" '+ringStroke+
        ' stroke-width="'+(size*0.006)+'"/>'+
        '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*0.80)+'" fill="none" stroke="'+AC2+
        '" stroke-width="'+(size*0.002)+'" opacity="0.28"/>';
      break;
    case 'arc':
      rings = '<path d="M'+(cx-R)+' '+(cy+R*0.30)+
        ' A'+R+' '+(R*0.98)+' 0 0 1 '+(cx+R)+' '+(cy+R*0.30)+'" fill="none" '+ringStroke+
        ' stroke-width="'+(size*0.0065)+'"/>'+
        '<line x1="'+(cx-R*0.98)+'" y1="'+(cy+R*0.30)+'" x2="'+(cx+R*0.98)+'" y2="'+(cy+R*0.30)+
        '" stroke="'+AC+'" stroke-width="'+(size*0.003)+'" opacity="0.65"/>';
      break;
    case 'star': {
      let ps='';
      for(let i=0;i<10;i++){
        const a=(i*36-90)*Math.PI/180;
        const r=(i%2===0)?R:R*0.74;
        ps += (i?'L':'M')+(cx+Math.cos(a)*r).toFixed(1)+' '+(cy+Math.sin(a)*r).toFixed(1);
      }
      rings = '<path d="'+ps+'Z" fill="none" '+ringStroke+' stroke-width="'+(size*0.005)+
        '" stroke-linejoin="round"/>';
      break;
    }
    case 'grid': {
      rings = '<rect x="'+(cx-R*0.86)+'" y="'+(cy-R*0.86)+'" width="'+(R*1.72)+'" height="'+(R*1.72)+
        '" fill="none" '+ringStroke+' stroke-width="'+(size*0.0045)+'" transform="rotate(45 '+cx+' '+cy+')"/>'+
        '<rect x="'+(cx-R*0.62)+'" y="'+(cy-R*0.62)+'" width="'+(R*1.24)+'" height="'+(R*1.24)+
        '" fill="none" stroke="'+AC2+'" stroke-width="'+(size*0.002)+'" opacity="0.35" '+
        'transform="rotate(45 '+cx+' '+cy+')"/>';
      break;
    }
    case 'lantern': {
      // 灯笼形外框（上下收口的八边形）
      const lw = R*0.94, lh = R*1.04;
      const lt = cy - lh, lb = cy + lh;
      const lm = cy - lh*0.52, lm2 = cy + lh*0.52;
      rings = '<path d="M'+(cx-lw*0.62)+' '+lt+
        ' L'+(cx+lw*0.62)+' '+lt+
        ' L'+(cx+lw*1.10)+' '+lm+
        ' L'+(cx+lw*1.10)+' '+lm2+
        ' L'+(cx+lw*0.62)+' '+lb+
        ' L'+(cx-lw*0.62)+' '+lb+
        ' L'+(cx-lw*1.10)+' '+lm2+
        ' L'+(cx-lw*1.10)+' '+lm+ ' Z" '+
        'fill="none" '+ringStroke+' stroke-width="'+(size*0.0065)+'" stroke-linejoin="round"/>';
      // 提梁
      rings += '<path d="M'+(cx-lw*0.30)+' '+(lt-size*0.030)+' Q'+cx+' '+(lt-size*0.085)+
        ' '+(cx+lw*0.30)+' '+(lt-size*0.030)+'" fill="none" stroke="'+AC+
        '" stroke-width="'+(size*0.0045)+'" stroke-linecap="round"/>';
      // 底部流苏
      for(let i=-1;i<=1;i++){
        rings += '<line x1="'+(cx+i*size*0.030)+'" y1="'+(lb)+'" x2="'+(cx+i*size*0.036)+
          '" y2="'+(lb+size*0.042)+'" stroke="'+AC+'" stroke-width="'+(size*0.0035)+
          '" stroke-linecap="round" opacity="0.6"/>';
      }
      // 笼内横档
      rings += '<line x1="'+(cx-lw*0.72)+'" y1="'+lm+'" x2="'+(cx+lw*0.72)+'" y2="'+lm+
        '" stroke="'+AC+'" stroke-width="'+(size*0.0018)+'" opacity="0.35"/>';
      break;
    }
    case 'single': {
      // 极简：一圈几乎看不见的细线 + 一个孤立的点
      rings = '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+AC+
        '" stroke-width="'+(size*0.0012)+'" opacity="0.16"/>';
      // 只保留一个光点（不是一圈）
      rings += '<circle cx="'+cx+'" cy="'+(cy-R*1.22)+'" r="'+(size*0.014)+
        '" fill="'+AC+'" opacity="0.85"/>';
      rings += '<circle cx="'+cx+'" cy="'+(cy-R*1.22)+'" r="'+(size*0.034)+
        '" fill="'+AC+'" opacity="0.18" filter="url(#'+uid+'_soft)"/>';
      // 四段极短的刻度（几乎不构成环）
      for(let i=0;i<4;i++){
        const a=(i*90+45)*Math.PI/180;
        rings += '<line x1="'+(cx+Math.cos(a)*R*0.94).toFixed(1)+'" y1="'+(cy+Math.sin(a)*R*0.94).toFixed(1)+
          '" x2="'+(cx+Math.cos(a)*R*1.02).toFixed(1)+'" y2="'+(cy+Math.sin(a)*R*1.02).toFixed(1)+
          '" stroke="'+AC+'" stroke-width="'+(size*0.0030)+'" opacity="0.30" stroke-linecap="round"/>';
      }
      break;
    }
    case 'weave': {
      rings = '';
      for(let k=0;k<2;k++){
        const rr = R*(0.98 - k*0.14);
        let pw='';
        for(let i=0;i<=72;i++){
          const a=i*5*Math.PI/180;
          const wob = Math.sin(a*3 + k*1.5)*size*0.012;
          pw += (i?'L':'M')+(cx+Math.cos(a)*(rr+wob)).toFixed(1)+' '+
            (cy+Math.sin(a)*(rr+wob)).toFixed(1);
        }
        rings += '<path d="'+pw+'" fill="none" stroke="'+(k?AC2:AC)+
          '" stroke-width="'+(size*(k?0.002:0.0055))+'" opacity="'+(k?0.42:0.85)+'"/>';
      }
      break;
    }
    case 'moon':
      rings = '<path d="M'+(cx+Math.cos(-Math.PI/2)*R)+' '+(cy+Math.sin(-Math.PI/2)*R)+
        ' A'+R+' '+R+' 0 1 1 '+(cx+R*0.72)+' '+(cy+R*0.70)+'" fill="none" '+ringStroke+
        ' stroke-width="'+(size*0.0065)+'" stroke-linecap="round"/>';
      break;
    case 'compass': {
      // 外方框（仪器外壳）
      const sq = R*1.12;
      rings = '<rect x="'+(cx-sq)+'" y="'+(cy-sq)+'" width="'+(sq*2)+'" height="'+(sq*2)+'" '+
        'fill="none" stroke="'+AC2+'" stroke-width="'+(size*0.0018)+'" opacity="0.30"/>';
      // 四角括号
      const cl = R*0.20;
      [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(sg){
        const x = cx + sg[0]*sq, y = cy + sg[1]*sq;
        rings += '<path d="M'+(x - sg[0]*cl)+' '+y+' L'+x+' '+y+' L'+x+' '+(y - sg[1]*cl)+'" '+
          'fill="none" stroke="'+AC+'" stroke-width="'+(size*0.0040)+'" opacity="0.75" '+
          'stroke-linecap="round"/>';
      });
      // 主环
      rings += '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" '+ringStroke+
        ' stroke-width="'+(size*0.0055)+'"/>';
      // 内环
      rings += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*0.88)+'" fill="none" stroke="'+AC2+
        '" stroke-width="'+(size*0.0016)+'" opacity="0.42"/>';
      // 四分准线（贯穿到方框）
      for(let i=0;i<4;i++){
        const a=i*90*Math.PI/180;
        rings += '<line x1="'+(cx+Math.cos(a)*R*0.70).toFixed(1)+'" y1="'+(cy+Math.sin(a)*R*0.70).toFixed(1)+
          '" x2="'+(cx+Math.cos(a)*sq).toFixed(1)+'" y2="'+(cy+Math.sin(a)*sq).toFixed(1)+
          '" stroke="'+AC+'" stroke-width="'+(size*0.0018)+'" opacity="0.45"/>';
      }
      break;
    }
    case 'arrow': {
      // 环带一个箭头缺口（指向右）
      const gapA = 12 * Math.PI/180;
      const arc1 = '<path d="M'+(cx+Math.cos(gapA)*R).toFixed(1)+' '+(cy+Math.sin(gapA)*R).toFixed(1)+
        ' A'+R+' '+R+' 0 1 1 '+(cx+Math.cos(-gapA)*R).toFixed(1)+' '+(cy+Math.sin(-gapA)*R).toFixed(1)+'" '+
        'fill="none" '+ringStroke+' stroke-width="'+(size*0.0075)+'" stroke-linecap="round"/>';
      rings = arc1;
      // 缺口处的箭头
      const ax = cx + R, w = size*0.030;
      rings += '<path d="M'+(ax-w*1.5)+' '+(cy-w)+' L'+(ax-w*0.2)+' '+cy+' L'+(ax-w*1.5)+' '+(cy+w)+'" '+
        'fill="none" stroke="'+AC+'" stroke-width="'+(size*0.0060)+'" '+
        'stroke-linecap="round" stroke-linejoin="round"/>';
      // 三段速度弧
      for(let i=0;i<3;i++){
        const rr = R*(0.80 - i*0.055);
        rings += '<path d="M'+(cx+Math.cos(2.1)*rr).toFixed(1)+' '+(cy+Math.sin(2.1)*rr).toFixed(1)+
          ' A'+rr+' '+rr+' 0 0 1 '+(cx+Math.cos(2.9)*rr).toFixed(1)+' '+(cy+Math.sin(2.9)*rr).toFixed(1)+'" '+
          'fill="none" stroke="'+AC2+'" stroke-width="'+(size*0.0022)+'" opacity="'+(0.30-i*0.07)+
          '" stroke-linecap="round"/>';
      }
      break;
    }
    default:
      rings = '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" '+ringStroke+
        ' stroke-width="'+(size*0.006)+'"/>';
  }

  // ---------- 刻度 ----------
  let ticks='';
  if(au.ring!=='grid' && au.ring!=='weave' && au.ring!=='moon'){
    for(let i=0;i<72;i++){
      const a=i*5*Math.PI/180;
      const isM=(i%6===0);
      const r1=R*0.955, r2=r1-(isM?size*0.026:size*0.012);
      ticks += '<line x1="'+(cx+Math.cos(a)*r1).toFixed(1)+'" y1="'+(cy+Math.sin(a)*r1).toFixed(1)+
        '" x2="'+(cx+Math.cos(a)*r2).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r2).toFixed(1)+
        '" stroke="'+AC+'" stroke-width="'+(isM?size*0.0035:size*0.0018)+'" '+
        'opacity="'+(isM?0.80:0.30)+'"/>';
    }
  }

  // ---------- 拉丁文 ----------
  let latinTxt='';
  if(latin){
    const chars=latin.split('');
    const arcR=R*0.84;
    chars.forEach((ch,i)=>{
      const t=(i/(chars.length-1))*2-1;
      const a=(-90+t*62)*Math.PI/180;
      const x=cx+Math.cos(a)*arcR, y=cy+Math.sin(a)*arcR;
      const rot=(a*180/Math.PI)+90;
      latinTxt += '<text x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" '+
        'font-size="'+(size*0.029)+'" fill="'+AC+'" opacity="0.80" '+
        'text-anchor="middle" dominant-baseline="middle" '+
        'font-family="Georgia,serif" '+
        'transform="rotate('+rot.toFixed(1)+' '+x.toFixed(2)+' '+y.toFixed(2)+')">'+
        ch+'</text>';
    });
  }

  // ---------- 附加装饰 ----------
  let deco='';
  switch(au.deco){
    case 'gap':   // 缺口弧
      deco = '<path d="M'+(cx-R*0.55)+' '+(cy-R*0.85)+' A'+R+' '+R+' 0 0 1 '+(cx+R*0.55)+' '+(cy-R*0.85)+
        '" fill="none" stroke="'+AC+'" stroke-width="'+(size*0.010)+'" stroke-linecap="round" opacity="0.35"/>';
      break;
    case 'rise':  // 上升线
      for(let i=0;i<3;i++){
        const yy = cy + R*(0.55 - i*0.18);
        deco += '<path d="M'+(cx-R*0.5)+' '+yy.toFixed(1)+' Q'+cx+' '+(yy-R*0.14).toFixed(1)+
          ' '+(cx+R*0.5)+' '+yy.toFixed(1)+'" fill="none" stroke="'+AC+
          '" stroke-width="'+(size*0.0025)+'" opacity="'+(0.30-i*0.07)+'"/>';
      }
      break;
    case 'stone':
      deco = '<circle cx="'+(cx+R*0.66)+'" cy="'+(cy+R*0.66)+'" r="'+(size*0.040)+
        '" fill="none" stroke="'+AC+'" stroke-width="'+(size*0.0028)+'" opacity="0.55"/>';
      break;
    case 'pillar':
      deco = '<rect x="'+(cx-size*0.030)+'" y="'+(cy-R*0.98)+'" width="'+(size*0.060)+
        '" height="'+(size*0.034)+'" fill="none" stroke="'+AC+
        '" stroke-width="'+(size*0.0026)+'" opacity="0.60"/>';
      break;
    case 'cup':
      deco = '<path d="M'+(cx-size*0.045)+' '+(cy-R*0.98)+
        ' L'+(cx-size*0.036)+' '+(cy-R*0.90)+
        ' Q'+cx+' '+(cy-R*0.80)+' '+(cx+size*0.036)+' '+(cy-R*0.90)+
        ' L'+(cx+size*0.045)+' '+(cy-R*0.98)+'" fill="none" stroke="'+AC+
        '" stroke-width="'+(size*0.0030)+'" opacity="0.75"/>';
      break;
    case 'burst':
      for(let i=0;i<8;i++){
        const a=(-90+i*45)*Math.PI/180;
        deco += '<line x1="'+(cx+Math.cos(a)*R*1.16).toFixed(1)+'" y1="'+(cy+Math.sin(a)*R*1.16).toFixed(1)+
          '" x2="'+(cx+Math.cos(a)*R*1.30).toFixed(1)+'" y2="'+(cy+Math.sin(a)*R*1.30).toFixed(1)+
          '" stroke="'+AC+'" stroke-width="'+(size*0.004)+'" stroke-linecap="round" opacity="0.55"/>';
      }
      break;
    case 'rain':
      for(let i=-2;i<=2;i++){
        const xx = cx + i*size*0.055;
        deco += '<line x1="'+xx.toFixed(1)+'" y1="'+(cy+R*1.14).toFixed(1)+
          '" x2="'+(xx+size*0.012).toFixed(1)+'" y2="'+(cy+R*1.30).toFixed(1)+
          '" stroke="'+AC+'" stroke-width="'+(size*0.0028)+'" stroke-linecap="round" opacity="0.45"/>';
      }
      break;
    case 'sunup':
      deco = '<path d="M'+(cx-R*0.42)+' '+(cy-R*0.94)+
        ' A'+(R*0.42)+' '+(R*0.42)+' 0 0 1 '+(cx+R*0.42)+' '+(cy-R*0.94)+
        '" fill="none" stroke="'+AC+'" stroke-width="'+(size*0.0045)+'" opacity="0.7"/>';
      break;
    case 'spark': {
      const pos=[[-0.86,-0.62],[0.90,-0.48],[-0.72,0.86],[0.80,0.78]];
      pos.forEach(([fx,fy])=>{
        const x=cx+R*fx, y=cy+R*fy;
        deco += '<path d="M'+x+' '+(y-size*0.020)+' L'+(x+size*0.005)+' '+y+
          ' L'+x+' '+(y+size*0.020)+' L'+(x-size*0.005)+' '+y+' Z" fill="'+AC+'" opacity="0.6"/>';
      });
      break;
    }
    case 'line':
      deco = '<line x1="'+(cx-R*1.05)+'" y1="'+cy+'" x2="'+(cx+R*1.05)+'" y2="'+cy+
        '" stroke="'+AC2+'" stroke-width="'+(size*0.0018)+'" opacity="0.30"/>';
      break;
    case 'lamp':
      deco = '<circle cx="'+(cx+R*0.80)+'" cy="'+(cy-R*0.80)+'" r="'+(size*0.070)+
        '" fill="url(#'+uid+'_halo)" opacity="0.55"/>';
      break;
    case 'dot':
      deco = '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*1.10)+'" fill="none" stroke="'+AC+
        '" stroke-width="'+(size*0.0015)+'" opacity="0.22"/>';
      break;
    case 'hands':
      deco = '<path d="M'+(cx-R*0.60)+' '+(cy+R*1.02)+
        ' Q'+cx+' '+(cy+R*0.86)+' '+(cx+R*0.60)+' '+(cy+R*1.02)+'" fill="none" stroke="'+AC+
        '" stroke-width="'+(size*0.0035)+'" opacity="0.55"/>';
      break;
    case 'moonarc':
      deco = '<path d="M'+(cx-R*0.30)+' '+(cy-R*0.90)+
        ' A'+(R*0.30)+' '+(R*0.30)+' 0 1 0 '+(cx-R*0.30)+' '+(cy-R*0.90)+' Z" '+
        'fill="'+AC+'" opacity="0.18"/>';
      break;
    case 'cross':
      deco = '<line x1="'+cx+'" y1="'+(cy-R*1.16)+'" x2="'+cx+'" y2="'+(cy+R*1.16)+
        '" stroke="'+AC+'" stroke-width="'+(size*0.0015)+'" opacity="0.22"/>'+
        '<line x1="'+(cx-R*1.16)+'" y1="'+cy+'" x2="'+(cx+R*1.16)+'" y2="'+cy+
        '" stroke="'+AC+'" stroke-width="'+(size*0.0015)+'" opacity="0.22"/>';
      break;
    case 'arrow':
      deco = '<path d="M'+(cx-R*1.24)+' '+cy+' L'+(cx-R*1.10)+' '+(cy-size*0.022)+
        ' M'+(cx-R*1.24)+' '+cy+' L'+(cx-R*1.10)+' '+(cy+size*0.022)+'" fill="none" stroke="'+AC+
        '" stroke-width="'+(size*0.003)+'" opacity="0.65"/>';
      break;
  }

  // ---------- 粒子 ----------
  let dots='';
  const rnd=(n)=>((Math.sin(n*12.9898)*43758.5453)%1+1)%1;
  for(let i=0;i<14;i++){
    const a=rnd(i)*Math.PI*2;
    const rr=R*(1.24+rnd(i+50)*0.20);
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
    const r=size*(0.0035+rnd(i+99)*0.0045);
    dots += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(2)+'" '+
      'fill="'+AC+'" opacity="'+(0.28+rnd(i+7)*0.42).toFixed(2)+'"/>';
  }

  const coreR = R*0.58;

  return '<svg xmlns="http://www.w3.org/2000/svg" class="bdg" viewBox="0 0 '+size+' '+size+
      '" width="'+size+'" height="'+size+'" data-k="'+kind+'">'+
    '<defs>'+
      '<radialGradient id="'+uid+'_halo" cx="50%" cy="50%" r="50%">'+
        '<stop offset="0%" stop-color="'+AC+'" stop-opacity="0.40"/>'+
        '<stop offset="32%" stop-color="'+AC+'" stop-opacity="0.16"/>'+
        '<stop offset="66%" stop-color="'+AC2+'" stop-opacity="0.05"/>'+
        '<stop offset="100%" stop-color="'+AC2+'" stop-opacity="0"/>'+
      '</radialGradient>'+
      // 描边专用线性渐变（radialGradient 给 stroke 用会几乎全透明）
      '<linearGradient id="'+uid+'_haloline" x1="0" y1="0" x2="1" y2="1">'+
        '<stop offset="0%" stop-color="'+AC+'" stop-opacity="0.95"/>'+
        '<stop offset="45%" stop-color="'+AC2+'" stop-opacity="0.80"/>'+
        '<stop offset="100%" stop-color="'+AC+'" stop-opacity="0.95"/>'+
      '</linearGradient>'+
      '<linearGradient id="'+uid+'_sp" x1="0" y1="0" x2="0.3" y2="1">'+
        '<stop offset="0%" stop-color="'+AC+'" stop-opacity="0.98"/>'+
        '<stop offset="58%" stop-color="'+AC+'" stop-opacity="0.75"/>'+
        '<stop offset="100%" stop-color="'+AC2+'" stop-opacity="0.55"/>'+
      '</linearGradient>'+
      '<linearGradient id="'+uid+'_ring" x1="0" y1="0" x2="1" y2="1">'+
        '<stop offset="0%" stop-color="'+AC+'"/>'+
        '<stop offset="40%" stop-color="'+AC+'" stop-opacity="0.85"/>'+
        '<stop offset="72%" stop-color="'+AC2+'" stop-opacity="0.80"/>'+
        '<stop offset="100%" stop-color="'+AC+'"/>'+
      '</linearGradient>'+
      '<linearGradient id="'+uid+'_ray" x1="0" y1="1" x2="0" y2="0">'+
        '<stop offset="0%" stop-color="'+AC+'" stop-opacity="0.55"/>'+
        '<stop offset="100%" stop-color="'+AC+'" stop-opacity="0"/>'+
      '</linearGradient>'+
      '<radialGradient id="'+uid+'_core" cx="42%" cy="36%" r="72%">'+
        '<stop offset="0%" stop-color="#241F30"/>'+
        '<stop offset="58%" stop-color="#141020"/>'+
        '<stop offset="100%" stop-color="#08060E"/>'+
      '</radialGradient>'+
      '<filter id="'+uid+'_soft" x="-80%" y="-80%" width="260%" height="260%">'+
        '<feGaussianBlur stdDeviation="'+(size*0.026)+'"/></filter>'+
      '<filter id="'+uid+'_glow" x="-60%" y="-60%" width="220%" height="220%">'+
        '<feGaussianBlur stdDeviation="'+(size*0.013)+'" result="b1"/>'+
        '<feGaussianBlur stdDeviation="'+(size*0.032)+'" result="b2"/>'+
        '<feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/>'+
        '<feMergeNode in="SourceGraphic"/></feMerge>'+
      '</filter>'+
    '<filter id="'+uid+'_figglow" x="-40%" y="-40%" width="180%" height="180%">'+
        '<feDropShadow dx="0" dy="0" stdDeviation="'+(size*0.020)+'" flood-color="'+AC+'" flood-opacity="0.55"/>'+
      '</filter>'+'<filter id="'+uid+'_glowwide" x="-90%" y="-90%" width="280%" height="280%">'+
        '<feGaussianBlur stdDeviation="'+(size*0.030)+'"/></filter>'+'</defs>'+
    /* 爆开的光 */
    '<circle class="bd-flash" cx="'+cx+'" cy="'+cy+'" r="'+(R*0.5)+'" '+
      'fill="'+AC+'" opacity="0"/>'+
        /* 光晕：人物背后的柔光（模糊，不遮挡人物） */
    '<g class="bd-a a-halo">'+
      /* 内层实光 */
      '<g filter="url(#'+uid+'_soft)">'+
        haloShape(au.halo, cx, cy, size*0.330, uid, 0.95)+
      '</g>'+
      /* 外层柔光扩散 */
      '<g filter="url(#'+uid+'_glowwide)">'+
        haloShape(au.halo, cx, cy, size*0.352, uid, 0.55)+
      '</g>'+
    '</g>'+    /* 背光：柔和的中央暗场，让人物更突出 */
    '<circle class="a-backdrop" cx="'+cx+'" cy="'+cy+'" r="'+(coreR*1.16)+'" '+
      'fill="url(#'+uid+'_halo)" opacity="0.22" filter="url(#'+uid+'_soft)"/>'+
    /* 光束 */
    '<g class="bd-rays bd-a a-rays" style="transform-origin:'+cx+'px '+cy+'px">'+rays+'</g>'+
    /* 尖刺 */
    '<g class="bd-spin bd-a a-spikes" style="transform-origin:'+cx+'px '+cy+'px; transform: scale(1.06)">'+spikes+'</g>'+
    /* 虚线环 */
    '<g class="bd-ccw bd-a a-ccw" style="transform-origin:'+cx+'px '+cy+'px">'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*1.26)+'" fill="none" stroke="'+AC+'" '+
      ' stroke-width="'+(size*0.0016)+'" stroke-dasharray="'+(size*0.020)+' '+(size*0.052)+'" opacity="0.32"/>'+
    '</g>'+
    /* 环 + 刻度 */
    '<g class="bd-a a-rings" style="transform-origin:'+cx+'px '+cy+'px">'+rings+ticks+'</g>'+
    /* 装饰 */
    '<g class="bd-a a-deco">'+deco+'</g>'+
    /* 拉丁文 */
    '<g class="bd-a a-latin">'+latinTxt+'</g>'+
    /* 中心盘：深色但通透，人物站在上面而不是陷在黑洞里 */
    '<defs><radialGradient id="'+uid+'_stage" cx="0.5" cy="0.22" r="0.85">'+
      '<stop offset="0%" stop-color="'+AC+'" stop-opacity="0.30"/>'+
      '<stop offset="45%" stop-color="'+AC2+'" stop-opacity="0.16"/>'+
      '<stop offset="100%" stop-color="#08060E" stop-opacity="0.92"/>'+
    '</radialGradient></defs>'+
    '<circle class="bd-a a-core" cx="'+cx+'" cy="'+cy+'" r="'+coreR+'" fill="url(#'+uid+'_stage)" '+
      'stroke="'+AC+'" stroke-width="'+(size*0.0022)+'" stroke-opacity="0.62" '+
      'style="transform-origin:'+cx+'px '+cy+'px"/>'+
    /* 地面：人物脚下的光带，把人和背景分开 */
    '<ellipse class="a-floor" cx="'+cx+'" cy="'+(cy+coreR*0.72)+'" rx="'+(coreR*0.62)+'" ry="'+(coreR*0.10)+'" '+
      'fill="'+AC+'" opacity="0.20" filter="url(#'+uid+'_soft)"/>'+
    /* 人物（放大 1.22 倍，让中心不空）*/
    '<g class="bd-pulse bd-a a-fig" filter="url(#'+uid+'_figglow)" '+

/* ============================================================

function sideSVG(){
  const syms=['M','K','W','N','H','L','D','R','S','A'];
  let s='';
  for(let i=0;i<10;i++){
    const y=120+i*180;
    const x=(i%2)?110:78;
    s+='<g transform="translate('+x+' '+y+')" style="color:#C89A5B">'+
      sym(syms[i],52,2.2)+'</g>';
  }
  return '<svg viewBox="0 0 200 2000" preserveAspectRatio="xMidYMid meet" '+
    'style="width:100%;height:auto">'+s+'</svg>';
}

/* 鼠标跟随光晕 */
function bindFollow(){
  const el=document.getElementById('cfollow');
  if(!el) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    el.style.display='none'; return;
  }
  let tx=0.5, ty=0.4, cx=0.5, cy=0.4, raf=null, active=false;
  const onMove=(e)=>{
    const w=window.innerWidth||1, hh=window.innerHeight||1;
    tx=(e.clientX||0)/w;
    ty=(e.clientY||0)/hh;
    if(!active){ active=true; el.classList.add('on'); loop(); }
  };
  const loop=()=>{
    cx += (tx-cx)*0.09;
    cy += (ty-cy)*0.09;
    el.style.left=(cx*100).toFixed(2)+'%';
    el.style.top=(cy*100).toFixed(2)+'%';
    raf=requestAnimationFrame(loop);
  };
  document.addEventListener('mousemove', onMove, {passive:true});
}

/* 星尘 */
function starDust(n){
  let s='';
  for(let i=0;i<n;i++){
    const x=(Math.sin(i*127.1)*43758.5453%1+1)%1*100;
    const y=(Math.sin(i*311.7)*43758.5453%1+1)%1*100;
    const d=(Math.sin(i*74.3)*43758.5453%1+1)%1;
    const sz=1+d*2.2;
    const dur=(6+d*10).toFixed(1);
    const dl=(d*8).toFixed(1);
    s+='<i style="left:'+x.toFixed(2)+'%;top:'+y.toFixed(2)+'%;width:'+sz.toFixed(1)+
       'px;height:'+sz.toFixed(1)+'px;--d:'+dur+'s;--l:'+dl+'s;opacity:'+(0.2+d*0.5).toFixed(2)+'"></i>';
  }
  return s;
}

/* 跑马灯条目 */
function marqueeItems(){
  const names=Object.keys(SCHOOLS);
  let s='';
  names.forEach(n=>{
    const au=AURA[n]||{};
    s+='<span class="cm-i" style="color:'+(au.ac||'#F0C87E')+'">'+(SCHOOLS[n].alias||n)+'</span>';
    s+='<span class="cm-dot"></span>';
  });
  return s;
}

/* 继续上次 */
function resume(){
  var st = loadStore();
  if(st.ans && st.ans.length === Q.length){
    S.ans = st.ans.slice();
    S.i = Math.min(st.i || 0, Q.length - 1);
    // 跳到第一个未答的题
    for(var i=0;i<S.ans.length;i++){
      if(S.ans[i]===null || S.ans[i]===undefined){ S.i=i; break; }
    }
  }
  S.phase = 'quiz';
  renderQuiz();
}

/* 彻底重来 */
function startFresh(){
  clearProgress();
  resetOrder();        // 换一套新顺序
  start();
}

function start(){
  getOrder();                 // 沿用本用户的顺序
  S.i=0;
  S.ans=new Array(Q.length).fill(null);
  S.phase='quiz';
  renderQuiz();
}

function renderQuiz(){
  const od = getOrder();
  const q = Q[od[S.i]];
  const pct=Math.round(S.i/Q.length*100);
  const seg=Math.floor(S.i/11)+1;
  let opts='';
  q.o.forEach((o,i)=>{
    opts+='<div class="opt '+(S.ans[S.i]===i?'on':'')+'" onclick="pick('+i+')">'+
      '<div class="mk"></div><div class="t">'+o.t+'</div></div>';
  });
  app.innerHTML=
  '<div class="top">'+
    '<div class="qmeta"><span>第 '+seg+' 组 · '+
      String(S.i+1).padStart(2,'0')+' / '+Q.length+'</span>'+
      '<span class="cur">'+pct+'%</span></div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
  '<div class="qwrap">'+
    '<div class="qnum">第 '+String(S.i+1).padStart(2,'0')+' 问</div>'+
    '<div class="qtext">'+q.t+'</div>'+opts+'</div>'+
  '<div class="footbar"><button class="prev" onclick="prev()" '+
    (S.i===0?'disabled':'')+'><span class="ar">‹</span> 上一题</button></div>';
  window.scrollTo(0,0);
}

let lock=false;
function pick(i){
  if(lock)return;
  S.ans[S.i]=i;
  saveProgress();
  lock=true;
  const els=document.querySelectorAll('.opt');
  els.forEach((el,idx)=>{
    el.classList.toggle('on',idx===i);
    el.style.pointerEvents='none';
  });
  setTimeout(()=>{
    lock=false;
    saveProgress();
    if(S.i<Q.length-1){S.i++;renderQuiz()}
    else renderResult();
  },380);
}

/* ============================================================
   雷达图：横向加宽 + 逐笔绘制
   ============================================================ */
function drawRadar(val,code){
  const box=document.getElementById('radarBox');
  if(!box)return;
  // 画布加宽，保证左右两侧标签不被裁切
  const W=780,H=700,cx=390,cy=345;
  const R=196;                       // 正六边形半径

  // 六边形顶点（-90 起，每 60 度）
  const pt=(i,r)=>{
    const a=(-90+i*60)*Math.PI/180;
    return[cx+Math.cos(a)*R*r,cy+Math.sin(a)*R*r];
  };
  const hexPath=(r)=>{
    return AX.map((_,i)=>pt(i,r)).map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  };

  // 背景光晕
  let back='<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*1.34)+'" fill="rgba(20,24,38,.55)"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*1.34)+'" fill="none" stroke="rgba(240,200,126,.22)" stroke-width="1.5"/>';

  // 网格：6 层同心六边形
  let grid='';
  [0.2,0.36,0.52,0.68,0.84,1.0].forEach((r,idx)=>{
    const op=(0.22+idx*0.09).toFixed(2);
    grid+='<polygon points="'+hexPath(r)+'" fill="none" '+
      'stroke="rgba(240,200,126,'+op+')" stroke-width="1.3" class="rd-grid" style="opacity:0"/>';
  });
  // 最外圈加粗
  grid+='<polygon points="'+hexPath(1.0)+'" fill="none" stroke="#F0C87E" '+
    'stroke-width="2.4" class="rd-grid" style="opacity:0"/>';

  // 6 条轴线
  let sp='';
  AX.forEach((a,i)=>{
    const[x,y]=pt(i,1.0);
    sp+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+
      '" stroke="rgba(240,200,126,.42)" stroke-width="1.4" class="rd-spoke" style="opacity:0"/>';
  });

  // 数据多边形（值域 -1~1 映射到 0.12~1.0）
  const ratios=AX.map(a=>0.12+Math.abs(val[a.k])*0.88);
  const dp=AX.map((a,i)=>pt(i,ratios[i]));
  const poly=dp.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');

  // 顶点
  let dots='';
  AX.forEach((a,i)=>{
    const[x,y]=dp[i];
    dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="7.5" '+
      'fill="#0A0C13" stroke="'+a.c+'" stroke-width="2.2" class="rd-dot" style="opacity:0"/>';
    dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" '+
      'fill="'+a.c+'" class="rd-dot" style="opacity:0"/>';
  });

  // 标签
  let labels='';
  AX.forEach((a,i)=>{
    const v=val[a.k];
    const lean=v>0?a.R:a.L;
    const pct=Math.round(Math.abs(v)*100);
    const[lx,ly]=pt(i,1.26);
    let anc='middle';
    const c=Math.cos((-90+i*60)*Math.PI/180);
    if(c>0.25)anc='start';
    if(c<-0.25)anc='end';
    // 左右两侧再向内收 6px，彻底避免裁切
    const lx2 = (anc==='end') ? lx+6 : ((anc==='start') ? lx-6 : lx);
    // 第一行：维度名（小字灰）
    labels+='<text x="'+lx2.toFixed(1)+'" y="'+(ly-21).toFixed(1)+'" font-size="9.5" '+
      'fill="#7A8498" text-anchor="'+anc+'" font-weight="600" letter-spacing="3" '+
      'font-family="PingFang SC,system-ui,sans-serif" '+
      'class="rd-lb" style="opacity:0">'+a.name+'</text>';
    // 第二行：倾向 + 百分比（大字）
    labels+='<text x="'+lx2.toFixed(1)+'" y="'+(ly+2).toFixed(1)+'" font-size="16" '+
      'fill="#E8ECF5" text-anchor="'+anc+'" font-weight="700" letter-spacing="1.5" '+
      'font-family="Songti SC,STSong,SimSun,serif" '+
      'class="rd-lb" style="opacity:0">'+lean+' <tspan fill="#F0C87E">'+pct+'%</tspan></text>';
  });

  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="auto">'+
    '<defs>'+
      '<radialGradient id="rf" cx="50%" cy="50%">'+
        '<stop offset="0%" stop-color="#F0C87E" stop-opacity="0.52"/>'+
        '<stop offset="100%" stop-color="#C89A4E" stop-opacity="0.24"/>'+
      '</radialGradient>'+
      '<filter id="rglow" x="-40%" y="-40%" width="180%" height="180%">'+
        '<feGaussianBlur stdDeviation="6" result="b"/>'+
        '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>'+
      '</filter>'+
    '</defs>'+
    back+grid+sp+
    '<polygon points="'+poly+'" fill="url(#rf)" stroke="#FFE0A8" stroke-width="2.6" '+
      'stroke-linejoin="round" filter="url(#rglow)" class="rd-poly" style="opacity:0"/>'+
    dots+labels+
    '<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#F0C87E"/>'+
  '</svg>';

  const sched=(sel,delay,dur)=>{
    document.querySelectorAll(sel).forEach((el,i)=>{
      el.style.transition='opacity '+dur+'ms ease';
      setTimeout(()=>{el.style.opacity='1'},delay+i*60);
    });
  };
  sched('.rd-grid',0,700);
  sched('.rd-spoke',380,600);
  setTimeout(()=>{
    const p=document.querySelector('.rd-poly');
    if(p){p.style.transition='opacity 1.2s ease';p.style.opacity='1'}
  },720);
  sched('.rd-dot',1200,600);
  sched('.rd-lb',1400,700);
}

/* 把画好的 canvas 转成 <img>，让手机长按也能保存（iOS 长按 canvas 无效） */
function exposePosterImage(){
  try{
    const cv=document.getElementById('pcanvas');
    const img=document.getElementById('pimg');
    if(!cv||!img) return;
    const data=cv.toDataURL('image/png');
    img.src=data;
    img.style.display='block';
    cv.style.display='none';
    _posterData=data;
  }catch(e){
    // 转不出来（极少见）就继续显示 canvas，下载按钮仍可尝试
  }
}

/* 保存海报：优先真下载，失败则提示长按 */
function savePoster(){
  const btn=document.getElementById('btnSavePoster');
  const hint=document.getElementById('posterHint');
  let data=_posterData;
  if(!data){
    try{ data=document.getElementById('pcanvas').toDataURL('image/png'); }catch(e){}
  }
  if(!data){
    if(hint) hint.textContent='这个浏览器不支持直接保存，请长按图片试试';
    return;
  }
  const fname='主义人格测试_'+(CUR?showName(CUR.code):'结果')+'.png';
  let ok=false;
  try{
    const a=document.createElement('a');
    a.href=data;
    a.download=fname;
    a.rel='noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    ok=true;
  }catch(e){ ok=false; }
  if(!ok){
    // 退路：新窗口打开图片，让用户自己右键/长按
    try{
      const w=window.open('','_blank');
      if(w){ w.document.write('<img src="'+data+'" style="max-width:100%">'); }
      ok=!!w;
    }catch(e){}
  }
  if(btn){
    const old=btn.textContent;
    btn.textContent = ok ? '已 保 存 ✓' : '请 长 按 图 片 保 存';
    btn.disabled=true;
    setTimeout(function(){ btn.textContent=old; btn.disabled=false; },1800);
  }
  if(hint && ok) hint.textContent='已保存到下载文件夹 · 手机请在相册里查看';
}

var _posterData=null;

function openPoster(){
  if(!CUR)return;
  const cv=document.getElementById('pcanvas');
  const ctx=cv.getContext('2d');
  const W=750,H=1334;
  cv.width=W;cv.height=H;
  const AC = (AURA[CUR.code] && AURA[CUR.code].ac) || '#F0C87E';

  document.getElementById('poster').classList.add('show');

  // 每次重新打开：先显示 canvas，画完再切成 img
  _posterData=null;
  try{
    const _im=document.getElementById('pimg');
    if(_im){ _im.style.display='none'; _im.removeAttribute('src'); }
    cv.style.display='block';
  }catch(e){}
  try{
    const _h=document.getElementById('posterHint');
    if(_h) _h.textContent='点「存为图片」直接下载 · 手机也可长按图片保存';
    const _b=document.getElementById('btnSavePoster');
    if(_b){ _b.textContent='存 为 图 片'; _b.disabled=false; }
  }catch(e){}

  // ===== 1. 深空底 =====
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#101320');
  g.addColorStop(.35,'#0C0F18');
  g.addColorStop(1,'#06080D');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // ===== 2. 星点（用派色，不均匀）=====
  for(let i=0;i<200;i++){
    const x=Math.random()*W, y=Math.random()*H;
    const r=Math.random()*1.5+0.3;
    const o=Math.random()*0.55+0.10;
    ctx.beginPath();ctx.arc(x,y,r,0,6.283);
    ctx.fillStyle='rgba(255,255,255,'+o.toFixed(2)+')';ctx.fill();
  }

  // ===== 3. 中心光（在徽章位置）=====
  const neb=ctx.createRadialGradient(W/2,340,0,W/2,340,430);
  neb.addColorStop(0, AC+'55');
  neb.addColorStop(.45, AC+'1A');
  neb.addColorStop(1, AC+'00');
  ctx.fillStyle=neb;ctx.fillRect(0,0,W,700);

  // ===== 4. 外框（双线）=====
  ctx.strokeStyle='rgba(240,200,126,.28)';ctx.lineWidth=1.6;
  ctx.strokeRect(30,30,W-60,H-60);
  ctx.strokeStyle='rgba(240,200,126,.10)';ctx.lineWidth=.9;
  ctx.strokeRect(40,40,W-80,H-80);

  ctx.textAlign='center';

  // ===== 5. 顶标 =====
  ctx.fillStyle='rgba(240,200,126,.78)';
  ctx.font='700 18px "PingFang SC",sans-serif';
  try{ctx.letterSpacing='7px'}catch(e){}
  ctx.fillText('YOUR PHILOSOPHY',W/2,106);
  try{ctx.letterSpacing='0px'}catch(e){}

  // 顶标下的小短线
  ctx.strokeStyle='rgba(240,200,126,.35)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W/2-40,126);ctx.lineTo(W/2+40,126);ctx.stroke();

  // ===== 6. 徽章（大：340px，中心 y=340）=====
  var badgeSize = 340, badgeY = 345;
  var done = false;
  function afterBadge(){
    if(done) return;
    done = true;
    drawPosterRest(ctx, W, H);
    _posterData=null;
    // 画完立刻转成图片，保证手机长按能存
    setTimeout(exposePosterImage, 30);
  }

  try{
    var svgStr = badgeSVG(CUR.code, badgeSize);
    svgStr = svgStr.replace(/class="[^"]*bd-a[^"]*"/g, '');
    var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
    var img = new Image();
    img.onload = function(){
      ctx.save();
      // 徽章底部加柔光
      var gl = ctx.createRadialGradient(W/2, badgeY, 0, W/2, badgeY, badgeSize*0.52);
      gl.addColorStop(0, AC+'33');
      gl.addColorStop(1, AC+'00');
      ctx.fillStyle = gl;
      ctx.fillRect(W/2-badgeSize*0.6, badgeY-badgeSize*0.6, badgeSize*1.2, badgeSize*1.2);
      ctx.drawImage(img, W/2-badgeSize/2, badgeY-badgeSize/2, badgeSize, badgeSize);
      ctx.restore();
      afterBadge();
    };
    img.onerror = function(){ afterBadge(); };
    img.src = url;
    // 兜底：1.2 秒还没加载就继续画
    setTimeout(afterBadge, 1200);
  }catch(e){
    afterBadge();
  }
}



/* canvas 版人物剪影 */


/* 16 个流派符号的 canvas 版 */


function drawPosterRest(ctx,W,H){
  const code=CUR.code;
  const AC = (AURA[code] && AURA[code].ac) || '#F0C87E';
  ctx.textAlign='center';

  // ===== 1. 名字 =====
  const nn = showName(code);
  const paren = (SCHOOLS[code] && SCHOOLS[code].alias && SCHOOLS[code].alias !== code)
                ? '（' + code + '）' : '';

  // 先量宽度做居中（名字 + 括号 作为整体）
  ctx.font='700 76px "Songti SC","SimSun",serif';
  const wName = ctx.measureText(nn).width;
  ctx.font='600 26px "PingFang SC",sans-serif';
  const wParen = paren ? ctx.measureText(paren).width : 0;
  const totalW = wName + wParen;
  const startX = W/2 - totalW/2;

  ctx.textAlign='left';
  ctx.fillStyle='#F7F2E4';
  ctx.font='700 76px "Songti SC","SimSun",serif';
  ctx.fillText(nn, startX, 658);
  if(paren){
    ctx.fillStyle='#8592AA';
    ctx.font='600 26px "PingFang SC",sans-serif';
    ctx.fillText(paren, startX + wName + 10, 652);
  }
  ctx.textAlign='center';

  // ===== 2. 金句（带引号装饰）=====
  ctx.fillStyle=AC;
  ctx.font='700 26px "Songti SC","SimSun",serif';
  ctx.globalAlpha=0.5;
  ctx.fillText('「', W/2 - 250, 730);
  ctx.textAlign='right';
  ctx.fillText('」', W/2 + 250, 730);
  ctx.textAlign='center';
  ctx.globalAlpha=1;

  ctx.fillStyle='#C4CBDC';
  ctx.font='400 27px "Songti SC","SimSun",serif';
  wrapText(ctx, CUR.quote, W/2, 748, W-190, 44);

  // ===== 3. 六维条形（清晰易读，替代大雷达）=====
  const BAR_X0   = 118;      // 条形起点
  const BAR_W    = 400;      // 条形最大宽度
  const ROW_Y0   = 862;      // 第一行 y
  const ROW_GAP  = 62;       // 行距

  AX.forEach(function(a, i){
    const v = CUR.val[a.k] || 0;
    const lean = v > 0 ? a.R : a.L;
    const pct = Math.round(Math.abs(v) * 100);
    const y = ROW_Y0 + i * ROW_GAP;
    const fillW = Math.max(BAR_W * (Math.abs(v)), 8);

    // 左：维度名
    ctx.textAlign='right';
    ctx.fillStyle='#78829A';
    ctx.font='600 17px "PingFang SC",sans-serif';
    ctx.fillText(a.name, BAR_X0 - 26, y + 7);

    // 条形轨道
    ctx.textAlign='left';
    ctx.fillStyle='rgba(255,255,255,.055)';
    roundRect(ctx, BAR_X0, y - 5, BAR_W, 11, 5.5);
    ctx.fill();

    // 条形填充（用派色渐变）
    const bg = ctx.createLinearGradient(BAR_X0, 0, BAR_X0 + BAR_W, 0);
    bg.addColorStop(0, AC + 'AA');
    bg.addColorStop(1, AC);
    ctx.fillStyle = bg;
    roundRect(ctx, BAR_X0, y - 5, fillW, 11, 5.5);
    ctx.fill();

    // 条形末端亮点
    ctx.beginPath();
    ctx.arc(BAR_X0 + fillW, y, 5, 0, 6.283);
    ctx.fillStyle = '#FFFFFF';
    ctx.globalAlpha = 0.85;
    ctx.fill();
    ctx.globalAlpha = 1;

    // 右侧：倾向 + 百分比
    ctx.fillStyle = '#F0C87E';
    ctx.font='700 21px "PingFang SC",sans-serif';
    ctx.fillText(lean, BAR_X0 + BAR_W + 24, y + 8);

    ctx.fillStyle='#7A8498';
    ctx.font='600 17px "PingFang SC",sans-serif';
    ctx.textAlign='right';
    ctx.fillText(pct + '%', W - 108, y + 8);
    ctx.textAlign='center';
  });

  // ===== 4. 分隔线 =====
  ctx.strokeStyle='rgba(240,200,126,.28)';ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(W/2-140, 1218);ctx.lineTo(W/2+140, 1218);
  ctx.stroke();
  ctx.fillStyle=AC;
  ctx.beginPath();ctx.arc(W/2,1218,3.5,0,6.283);ctx.fill();

  // ===== 5. 引流 =====
  ctx.fillStyle='#F0C87E';
  ctx.font='700 30px "Songti SC","SimSun",serif';
  ctx.fillText('六十六个选择，十六种活法',W/2,1272);

  ctx.fillStyle='#69738B';
  ctx.font='400 17px "PingFang SC",sans-serif';
  try{ctx.letterSpacing='2px'}catch(e){}
  ctx.fillText('你会是哪一种',W/2,1303);
  try{ctx.letterSpacing='0px'}catch(e){}
}

/* 圆角矩形 */
function roundRect(ctx,x,y,w,hh,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+hh-r);ctx.quadraticCurveTo(x+w,y+hh,x+w-r,y+hh);
  ctx.lineTo(x+r,y+hh);ctx.quadraticCurveTo(x,y+hh,x,y+hh-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}



function wrapText(ctx,text,x,y,maxW,lineH){
  const chars=text.split('');
  let line='',lines=[];
  for(let i=0;i<chars.length;i++){
    const test=line+chars[i];
    if(ctx.measureText(test).width>maxW&&line){
      lines.push(line);line=chars[i];
    }else{line=test}
  }
  if(line)lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineH));
}

function closePoster(){
  document.getElementById('poster').classList.remove('show');
}

/* ============================================================
   兜底：万一 CSS 动画没被推进（系统减少动效 / 内嵌浏览器 / 后台标签页节流），
   把所有依赖入场动画才可见的元素强制点亮，避免出现整页空白。
   ============================================================ */
function forceVisible(){
  const sel='.anim,.cw-h1 .ch,.bdg .bd-a';
  document.querySelectorAll(sel).forEach(function(el){
    const cs=getComputedStyle(el);
    if(parseFloat(cs.opacity) < 0.05){
      el.style.opacity='1';
      el.style.transform='none';
    }
  });
}
/* 页面进入后台时动画会暂停，回来时再补一次 */
document.addEventListener('visibilitychange',function(){
  if(!document.hidden) setTimeout(forceVisible,60);
});
setTimeout(forceVisible,2600);
window.addEventListener('pageshow',function(){ setTimeout(forceVisible,60); });
